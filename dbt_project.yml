name: customer_360
version: "1.0.0"
config-version: 2

profile: customer_360

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  customer_360:
    staging:
      +materialized: view
      +schema: staging   # resolves to dataset c360_staging
    intermediate:
      +materialized: view
      +schema: intermediate   # resolves to dataset c360_intermediate
    marts:
      +materialized: table
      +schema: marts          # resolves to dataset c360_marts; the only dataset the agent reads
